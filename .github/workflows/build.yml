name: Build TypeFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          unzip -q -o "$(ls *.zip | head -1)"
          ls -la TypeFlow

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: TypeFlow
        run: gradle assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-APK
          path: TypeFlow/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
