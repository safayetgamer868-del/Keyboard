name: Build SafariFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e
          ls -lah *.zip

      - name: Extract SafariFlow
        run: |
          set -e
          rm -rf SafariFlow
          unzip -q -o SafariFlow-Browser.zip
          ls -la SafariFlow

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: SafariFlow
        run: |
          gradle clean assembleDebug --console=plain

      - name: Verify APK
        run: |
          test -f SafariFlow/app/build/outputs/apk/debug/app-debug.apk
          ls -lh SafariFlow/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafariFlow-APK
          path: SafariFlow/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
