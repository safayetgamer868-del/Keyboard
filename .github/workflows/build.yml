name: Build APK from zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q HeliBoard-4.1-modded.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: HeliBoard-4.1
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-mod-apk
          path: HeliBoard-4.1/app/build/outputs/apk/debug/*.apk

      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: HeliBoard-4.1/app/build/reports
          
