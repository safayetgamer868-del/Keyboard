name: Build SafariFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          set -e
          test -f SafariFlow-Full-Source.zip
          unzip -t SafariFlow-Full-Source.zip >/dev/null
          echo "Source ZIP OK"

      - name: Extract SafariFlow source
        run: |
          set -e
          rm -rf SafariFlow-Full
          unzip -q -o SafariFlow-Full-Source.zip

          test -d SafariFlow-Full
          test -f SafariFlow-Full/settings.gradle.kts
          test -f SafariFlow-Full/build.gradle.kts
          test -f SafariFlow-Full/app/build.gradle.kts

          echo "Source extracted successfully"
          ls -la SafariFlow-Full

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build SafariFlow APK
        working-directory: SafariFlow-Full
        run: |
          set -e
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        run: |
          set -e

          APK="SafariFlow-Full/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafariFlow-APK
          path: SafariFlow-Full/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
