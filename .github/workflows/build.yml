name: Build SafariFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          set -e
          test -f SafariFlow-Browser.zip
          unzip -t SafariFlow-Browser.zip >/dev/null

      - name: Extract SafariFlow source
        run: |
          set -e
          rm -rf SafariFlow
          unzip -q -o SafariFlow-Browser.zip

          test -d SafariFlow
          test -f SafariFlow/settings.gradle.kts
          test -f SafariFlow/build.gradle.kts
          test -f SafariFlow/app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: SafariFlow
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        run: |
          set -e

          APK="SafariFlow/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafariFlow-APK
          path: SafariFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
