name: Build TypeFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          echo "ZIP files found:"
          find . -maxdepth 1 -type f -name "*.zip" -print

      - name: Unzip fixed TypeFlow project
        run: |
          set -e

          ZIP_FILE="TypeFlow-SwiftKey-Dynamic-Themes-FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf TypeFlow
          unzip -q -o "$ZIP_FILE"

          echo "Project contents:"
          ls -la TypeFlow

      - name: Verify ViewStyling fix
        run: |
          set -e

          FILE="TypeFlow/app/src/main/java/com/typeflow/keyboard/ui/ViewStyling.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ViewStyling.kt not found!"
            exit 1
          fi

          echo "Checking ViewStyling.kt..."
          grep -n "this.shape = GradientDrawable.OVAL" "$FILE"

          echo "ViewStyling fix verified."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build TypeFlow Debug APK
        working-directory: TypeFlow
        run: |
          gradle clean assembleDebug --console=plain

      - name: Verify APK
        run: |
          APK="TypeFlow/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-APK
          path: TypeFlow/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
